<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ағылшын — жаттығулар</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Ctext x='16' y='23' font-size='19' font-family='-apple-system,Segoe UI,Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6feb">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script>
/* Applies the theme before first paint so a dark reader never sees a white
   flash. The stylesheet has no prefers-color-scheme fallback, so the attribute
   must always end up set. Key must match STORE_KEY in app.js. */
(function () {
  var th = null;
  try {
    var s = JSON.parse(localStorage.getItem('agylshyn_v1') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') th = s.theme;
  } catch (e) { /* no storage — fall through to the OS preference */ }
  if (!th) {
    try {
      th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { th = 'light'; }
  }
  document.documentElement.setAttribute('data-theme', th);
})();
</script>
</head>
<body data-view="home">

<!-- ================= home: intro + book picker ================= -->
<section id="home" class="screen">
  <!-- Account sits alone on the left, opposite the icon cluster: squeezed in
       among the search/theme/language icons it read as one more decoration and
       went unnoticed. It is optional — app.js unhides it only when
       supabase.config.js is filled in, so a fork with no backend shows nothing. -->
  <div class="acct-slot">
    <button type="button" class="acct-btn" data-open-auth hidden></button>
  </div>

  <div class="controls floating">
    <button type="button" class="theme-btn" data-open-find data-i18n-aria="find.open" data-tip="tip.find">🔎</button>
    <button type="button" class="theme-btn" data-theme-btn></button>
    <div class="lang-switch">
      <button type="button" data-lang="kk" data-tip="tip.lang.kk">KK</button><button type="button" data-lang="en" data-tip="tip.lang.en">EN</button>
    </div>
  </div>
  <div class="wrap">

    <header class="home-hero">
      <div class="hh-main">
        <div class="hero-mark">Grammar &amp; Vocabulary in Use</div>
        <h1 data-i18n="hero.h1"></h1>
        <p data-i18n="hero.p"></p>
      </div>
      <div class="hh-side">
        <div class="hero-stats">
          <div><div class="v" id="hsBooks">—</div><div class="k" data-i18n="hero.books"></div></div>
          <div><div class="v" id="hsUnits">—</div><div class="k" data-i18n="hero.units"></div></div>
          <div><div class="v" id="hsItems">—</div><div class="k" data-i18n="hero.questions"></div></div>
          <div><div class="v" id="hsDone">—</div><div class="k" data-i18n="hero.done"></div></div>
        </div>
        <div id="heroResume" class="hero-resume" hidden></div>
        <div id="heroDrill" class="hero-drill"></div>
      </div>
    </header>

    <button type="button" class="home-help home-start" id="homeStart" data-open-place>
      <span class="hh-icon">🧭</span>
      <span class="hh-text">
        <b data-i18n="plc.homeTitle"></b>
        <span id="homeStartSub" data-i18n="plc.homeSub"></span>
      </span>
      <span class="hh-go">→</span>
    </button>

    <button type="button" class="home-help" data-open-help>
      <span class="hh-icon">📘</span>
      <span class="hh-text">
        <b data-i18n="home.helpTitle"></b>
        <span data-i18n="home.helpSub"></span>
      </span>
      <span class="hh-go">→</span>
    </button>

    <div class="home-body">
      <div class="home-main">
        <div id="bookGrid"></div>
      </div>

      <aside class="home-aside" id="homeAside">
        <div id="asideDyn"></div>
      </aside>
    </div>

  </div>
</section>

<!-- ================= book ================= -->
<header class="topbar">
  <button id="menuBtn" class="icon-btn" data-i18n-aria="menu.aria" data-tip="tip.menu">☰</button>
  <a class="home-link" href="#/" data-i18n-aria="library.aria" data-tip="tip.home">◇</a>
  <button type="button" class="acct-btn topbar-acct" data-open-auth hidden></button>
  <div class="brand">
    <span class="brand-title" id="brandTitle"></span>
    <span class="brand-sub" id="brandSub"></span>
  </div>
  <nav class="tabs">
    <a href="#" data-tab="units"  class="tab" id="tabUnits" data-i18n="nav.units" data-tip="tip.units"></a>
    <a href="#" data-tab="errors" class="tab" id="tabErrors" data-tip="tip.errors"><span data-i18n="nav.errors"></span> <span id="errBadge" class="badge" hidden>0</span></a>
    <a href="#" data-tab="stats"  class="tab" id="tabStats" data-i18n="nav.stats" data-tip="tip.stats"></a>
    <a href="#/drill" class="tab tab-drill" id="tabDrill" data-i18n-aria="drill.title" data-tip="tip.drill">⚡</a>
    <button type="button" class="tab tab-find" data-open-find data-i18n-aria="find.open" data-tip="tip.find">🔎</button>
    <button type="button" class="tab tab-help" data-open-help data-i18n-aria="nav.help" data-tip="tip.help">?</button>
  </nav>
  <div class="controls">
    <button type="button" class="theme-btn" data-theme-btn></button>
    <div class="lang-switch">
      <button type="button" data-lang="kk" data-tip="tip.lang.kk">KK</button><button type="button" data-lang="en" data-tip="tip.lang.en">EN</button>
    </div>
  </div>
</header>

<!-- book on the left, exercises in the middle, unit list on the right:
     the same order you read a page in -->
<div class="layout">
  <aside id="pdfPane" class="pdf-pane" hidden>
    <div class="pdf-head">
      <span class="pdf-title" id="pdfTitle"></span>
      <!-- Only for the drawn-by-us reader below: the browser's own viewer
           comes with its own zoom and page counter. -->
      <div class="pdf-nav" id="pdfNav" hidden>
        <button type="button" class="pdf-btn" id="pdfOut" data-i18n-aria="pdf.zoomOut">−</button>
        <span class="pdf-pos" id="pdfPos"></span>
        <button type="button" class="pdf-btn" id="pdfIn" data-i18n-aria="pdf.zoomIn">+</button>
      </div>
      <a class="pdf-btn" id="pdfNewTab" target="_blank" rel="noopener" data-i18n-aria="pdf.newTab">↗</a>
      <button type="button" class="pdf-btn" id="pdfClose" data-i18n-aria="pdf.close">✕</button>
    </div>
    <iframe id="pdfFrame" class="pdf-frame" title="PDF"></iframe>
    <!-- Where pdfview.js draws the pages when the browser cannot embed one. -->
    <div id="pdfCanvas" class="pdf-canvas" hidden></div>
    <div class="pdf-fallback" id="pdfFallback" hidden></div>
  </aside>

  <div id="dragPdf" class="dragger" role="separator" aria-orientation="vertical" data-i18n-aria="ui.resize" hidden></div>

  <main id="main" class="main"></main>

  <div id="dragSidebar" class="dragger" role="separator" aria-orientation="vertical" data-i18n-aria="ui.resize"></div>

  <div id="overlay" class="overlay" hidden></div>

  <aside id="sidebar" class="sidebar">
    <div class="search-wrap">
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <!-- Collapses the list to a rail of unit numbers. Label, tip and arrow
           direction are set by app.js, which owns the collapsed state. -->
      <button type="button" id="sideMin" class="side-min-btn" data-side-min
              aria-controls="unitList">»</button>
    </div>
    <ul id="unitList" class="unit-list"></ul>
    <!-- Phone-only footer. Inside a book the topbar has room for navigation
         (menu · library · account · title) or for settings, not both, and at
         390px the title lost. Theme and language live down here instead; the
         CSS hides this whole strip on anything wider. Every control in the
         app is bound by event delegation, so this second copy needs no JS. -->
    <div class="sidebar-foot">
      <button type="button" class="theme-btn" data-theme-btn></button>
      <div class="lang-switch">
        <button type="button" data-lang="kk">KK</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </aside>
</div>

<!-- ================= help dialog (used from inside a book) ================= -->
<div id="helpModal" class="modal" hidden>
  <div class="modal-backdrop" data-close-help></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
    <div class="modal-head">
      <h2 id="helpModalTitle" data-i18n="help.h1"></h2>
      <button type="button" class="modal-close" data-close-help data-i18n-aria="help.close">✕</button>
    </div>
    <div id="helpModalBody" class="modal-body"></div>
  </div>
</div>

<!-- ================= placement: "where do I start?" quiz ================= -->
<div id="placeModal" class="modal" hidden>
  <div class="modal-backdrop" data-close-place></div>
  <div class="modal-panel place-panel" role="dialog" aria-modal="true" aria-labelledby="placeTitle">
    <div class="modal-head">
      <h2 id="placeTitle" data-i18n="plc.title"></h2>
      <button type="button" class="modal-close" data-close-place data-i18n-aria="plc.close">✕</button>
    </div>
    <div id="placeBody" class="modal-body place-body"></div>
  </div>
</div>

<!-- ================= account: optional cloud progress sync ================= -->
<div id="authModal" class="modal" hidden>
  <div class="modal-backdrop" data-close-auth></div>
  <div class="modal-panel auth-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="modal-head">
      <h2 id="authTitle" data-i18n="auth.title"></h2>
      <button type="button" class="modal-close" data-close-auth data-i18n-aria="auth.close">✕</button>
    </div>
    <div id="authBody" class="modal-body auth-body"></div>
  </div>
</div>

<!-- ================= find: search questions across books (Ctrl+K) ========= -->
<div id="findModal" class="modal" hidden>
  <div class="modal-backdrop" data-close-find></div>
  <div class="modal-panel find-panel" role="dialog" aria-modal="true" aria-labelledby="findTitle">
    <div class="modal-head">
      <h2 id="findTitle" data-i18n="find.title"></h2>
      <button type="button" class="modal-close" data-close-find data-i18n-aria="find.close">✕</button>
    </div>
    <div class="find-bar">
      <input id="findInput" type="search" autocomplete="off" spellcheck="false"
             autocapitalize="off" autocorrect="off" enterkeyhint="search"
             data-i18n-placeholder="find.placeholder" data-i18n-aria="find.title">
      <div id="findScope" class="find-scope"></div>
    </div>
    <div id="findResults" class="find-results"></div>
    <div id="findFoot" class="find-foot"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="help.js"></script>
<script src="books.js"></script>
<script src="placement.js"></script>
<script src="dict.js"></script>
<!-- Where the listening audio is served from; empty means "next to the site". -->
<script src="audio.config.js"></script>
<!-- Both must load before app.js: sync.js consumes the OAuth fragment on the way
     back from a provider, and app.js would otherwise try to route on it. -->
<script src="supabase.config.js"></script>
<script src="sync.js"></script>
<!-- Which books are paid and how one is fetched. After sync.js, which owns the
     access token it needs; empty api.config.js means every book is free. -->
<script src="api.config.js"></script>
<script src="entitle.js"></script>
<!-- Defines window.PDFVIEW; the ~1.8 MB of pdf.js behind it is only imported
     the first time a reader on a phone opens a book. -->
<script src="pdfview.js"></script>
<script src="app.js"></script>
<script>
/* Offline support. Registered after load so it never delays first paint, and
   guarded so opening index.html straight off the filesystem (file://) — where
   service workers are unavailable — still works.

   Self-healing: check for a new service worker on every load, and when a new
   one takes control (e.g. after the cache-first→network-first switch) reload
   once so the freshly-cached app.js/CSS actually run. Without this, a reader
   whose old worker cached stale JS would be stuck on it until a manual purge. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  var reloadedBySW = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloadedBySW) return;
    reloadedBySW = true;
    window.location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update();          // pull the latest sw.js right away
    }).catch(function () { /* offline unavailable — no matter */ });
  });
}
</script>
</body>
</html>
