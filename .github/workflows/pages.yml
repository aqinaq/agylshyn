# Publishes site/ to GitHub Pages → https://aqinaq.github.io/agylshyn/
#
# Why Actions rather than the "deploy from a branch" setting: Pages can only
# serve a branch root or /docs, and the app lives in site/. Uploading site/ as
# the artifact publishes it at the domain root without moving anything or
# maintaining a second branch.
#
# The artifact carries site/ whole, including whichever of pdf/ and audio/ are
# still in the checkout. While they are, the two bases in site/media.config.js
# stay empty and the relative paths in data/*.json resolve on their own. Pages
# serves Range requests, which is what lets an <audio> element seek.
#
# Size, measured rather than remembered (an older version of this comment said
# 800 MB, which was never right): site/ is 555 MB — audio 340, pdf 209. A
# published Pages site may be no larger than 1 GB, so the headroom is ~445 MB,
# and an IELTS book costs 130-200 MB of it (c19 104 MB of audio, c20 73, c21
# 163, plus a 2-44 MB PDF). That is two or three more books, not ten. Check this
# number before adding one.
#
# Once those two folders move to object storage (site/tools/upload_media.py, and
# the runbook in the root README), the bases point at the bucket, this artifact
# drops to about 15 MB, and nothing here has to change: the folders are simply
# no longer in the checkout to upload.
#
# ONE-TIME MANUAL STEP: Settings → Pages → Build and deployment → Source must be
# set to "GitHub Actions" before the first run. configure-pages can create that
# setting itself via `enablement: true`, but only with a token that has repo
# admin rights — GITHUB_TOKEN does not, so that route just fails the job.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets a deploy be re-run without a new commit

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a finished build
# is not thrown away half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The deploy is what publishes the site, so it is the right place to stop
      # a broken one from going out. These two take four seconds between them
      # and need no browser, so there is no reason for the deploy not to run
      # them: a rebuild that dropped questions, an index whose counts no longer
      # match the data, a hand-typed answer key with a question missing, an
      # answer checker that stopped accepting lowercase — all of it stops here
      # rather than reaching a reader. The eleven browser suites run separately,
      # in tests.yml, on the same push.
      - name: The site is not broken
        run: |
          node site/tests/audit.js
          node site/match_test.js

      # The other thing only the deploy can get wrong. This fails the job if any
      # book listed in site/tools/tiers.json is still sitting in site/data/ —
      # the one mistake that turns the paywall back into a picture of a lock.
      - name: No paid content in the artifact
        run: python3 site/tools/split_content.py --check

      # The other half of the same question: the free samples ARE published, so
      # they must match the books they were cut from. A stale sample is either
      # a book advertising units it no longer has, or a giveaway of a book that
      # stopped being paid.
      - name: Samples match their books
        run: python3 site/tools/build_samples.py --check

      - uses: actions/configure-pages@v5

      # ~800 MB of pdf/ and audio/. Uploading takes a few minutes.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
