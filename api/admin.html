<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>agylshyn — админ</title>
<!--
  Kept to one file with no build step and no CDN, for the same reason the rest
  of this project is: it has to keep working years from now without anybody
  reinstalling anything. It is also the page that holds the admin token, so the
  fewer moving parts reaching into it, the better.

  The token lives in sessionStorage: gone when the tab closes, never on disk,
  and never in a URL where it would end up in a browser history or a screenshot.
-->
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --text:#16191d; --muted:#667085;
    --line:#e3e6ea; --accent:#2f6feb; --ok:#1a7f45; --ok-bg:#e8f6ee;
    --bad:#c02b2b; --bad-bg:#fdecec; --dim:#98a2b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12151a; --panel:#181c22; --text:#e6e9ee; --muted:#98a2b3;
      --line:#2a313b; --accent:#5b8def; --ok:#5ec489; --ok-bg:#16281e;
      --bad:#f08b8b; --bad-bg:#2a1a1a; --dim:#667085;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px 20px 60px; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  input[type=text], input[type=password], input[type=number] {
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--text); font:inherit;
  }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button {
    padding:8px 13px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); color:var(--text); font:inherit; cursor:pointer;
  }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row > div { flex:1 1 200px; }
  .row > button { flex:none; }
  table { width:100%; border-collapse:collapse; margin-top:18px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  td.email { font-weight:560; }
  td small { display:block; color:var(--dim); font-size:11.5px; font-weight:400; }
  .chip {
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px;
    background:var(--ok-bg); color:var(--ok); margin:0 4px 4px 0; white-space:nowrap;
  }
  .chip.dead { background:var(--bad-bg); color:var(--bad); text-decoration:line-through; }
  .chip button { all:unset; cursor:pointer; margin-left:5px; opacity:.6; }
  .chip button:hover { opacity:1; }
  .none { color:var(--dim); font-size:12.5px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .acts button { font-size:12px; padding:5px 9px; }
  .msg { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:13px; }
  .msg.ok { background:var(--ok-bg); color:var(--ok); }
  .msg.err { background:var(--bad-bg); color:var(--bad); }
  .bar { display:flex; gap:10px; align-items:center; margin-top:18px; flex-wrap:wrap; }
  .bar input { max-width:280px; }
  .spacer { flex:1; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<div class="wrap">

  <h1>agylshyn — админ</h1>
  <div class="sub">Тіркелгендер және олардың құқықтары</div>

  <div id="gate" class="card" hidden>
    <div class="row">
      <div>
        <label for="tok">Админ кілті (ADMIN_TOKEN)</label>
        <input id="tok" type="password" autocomplete="off" spellcheck="false">
      </div>
      <button class="primary" id="enter">Кіру</button>
    </div>
    <div class="sub" style="margin:12px 0 0">
      Кілт тек осы қойындыда сақталады — жапсаң, жоғалады.
    </div>
  </div>

  <div id="panel" hidden>
    <div class="bar">
      <input id="q" type="text" placeholder="Пошта бойынша сүзу…">
      <button id="reload">Жаңарту</button>
      <div class="spacer"></div>
      <span class="sub" id="count" style="margin:0"></span>
      <button id="out">Шығу</button>
    </div>
    <div class="scroll"><table id="tbl">
      <thead><tr><th>Пошта</th><th>Құқықтары</th><th>Беру</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>

  <div id="msg"></div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'agylshyn_admin_tok';
  var gate = document.getElementById('gate');
  var panel = document.getElementById('panel');
  var msgEl = document.getElementById('msg');
  var tbody = document.querySelector('#tbl tbody');
  var users = [];
  var skus = [];

  function token() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setToken(v) {
    try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {}
  }

  function say(text, bad) {
    msgEl.innerHTML = '';
    if (!text) return;
    var d = document.createElement('div');
    d.className = 'msg ' + (bad ? 'err' : 'ok');
    d.textContent = text;
    msgEl.appendChild(d);
    if (!bad) setTimeout(function () { if (msgEl.contains(d)) msgEl.removeChild(d); }, 4000);
  }

  function api(path, opts) {
    opts = opts || {};
    var init = {
      method: opts.method || 'GET',
      headers: { 'X-Admin-Token': token(), 'Content-Type': 'application/json' }
    };
    if (opts.body) init.body = JSON.stringify(opts.body);
    // Same origin as this page, so no CORS and no base url to configure — the
    // panel is served by the very service it administers.
    return fetch(path, init).then(function (r) {
      return r.text().then(function (txt) {
        var j = null;
        try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('kk-KZ', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function render() {
    var filter = document.getElementById('q').value.trim().toLowerCase();
    var list = users.filter(function (u) {
      return !filter || (u.email || '').toLowerCase().indexOf(filter) >= 0;
    });
    document.getElementById('count').textContent =
      list.length + ' / ' + users.length + ' аккаунт';

    tbody.innerHTML = '';
    list.forEach(function (u) {
      var tr = document.createElement('tr');

      var td1 = document.createElement('td');
      td1.className = 'email';
      td1.textContent = u.email || u.id;
      var s = document.createElement('small');
      s.textContent = (u.name ? u.name + ' · ' : '') +
        'тіркелген ' + fmtDate(u.created_at) +
        ' · соңғы кіру ' + fmtDate(u.last_sign_in_at);
      td1.appendChild(s);
      tr.appendChild(td1);

      var td2 = document.createElement('td');
      if (!u.entitlements.length) {
        var n = document.createElement('span');
        n.className = 'none';
        n.textContent = 'жоқ';
        td2.appendChild(n);
      }
      u.entitlements.forEach(function (e) {
        var chip = document.createElement('span');
        chip.className = 'chip' + (e.live ? '' : ' dead');
        chip.appendChild(document.createTextNode(
          e.sku + (e.expires_at ? ' · ' + fmtDate(e.expires_at) : '')));
        var x = document.createElement('button');
        x.textContent = '✕';
        x.title = 'алып тастау';
        x.addEventListener('click', function () { revoke(u, e.sku); });
        chip.appendChild(x);
        td2.appendChild(chip);
      });
      tr.appendChild(td2);

      var td3 = document.createElement('td');
      var acts = document.createElement('div');
      acts.className = 'acts';
      skus.forEach(function (sku) {
        var has = u.entitlements.some(function (e) { return e.sku === sku && e.live; });
        var b = document.createElement('button');
        b.textContent = '+ ' + sku;
        b.disabled = has;
        b.title = has ? 'бұл құқық бар' : 'мәңгілікке беру';
        b.addEventListener('click', function () { grant(u, sku); });
        acts.appendChild(b);
      });
      td3.appendChild(acts);
      tr.appendChild(td3);

      tbody.appendChild(tr);
    });
  }

  function load() {
    return api('/v1/admin/users').then(function (j) {
      users = j.users || [];
      skus = j.skus || [];
      render();
    });
  }

  function grant(u, sku) {
    // Asking rather than assuming: "forever" and "a month" are both normal, and
    // the difference is money. Empty means forever, which is the common case.
    var days = prompt(u.email + ' → "' + sku + '"\n\n' +
      'Неше күнге? Бос қалдырсаң — мәңгілікке.', '');
    if (days === null) return;
    days = days.trim();
    var body = { user_id: u.id, sku: sku, source: 'admin-panel' };
    if (days) {
      var n = parseInt(days, 10);
      if (!(n > 0)) { say('Күн саны оң сан болуы керек', true); return; }
      body.days = n;
    }
    api('/v1/admin/grant', { method: 'POST', body: body })
      .then(function () {
        say(u.email + ' → ' + sku + (body.days ? ' (' + body.days + ' күн)' : ' (мәңгілік)'));
        return load();
      })
      .catch(function (e) { say(e.message, true); });
  }

  function revoke(u, sku) {
    if (!confirm(u.email + ' — "' + sku + '" құқығын алып тастау керек пе?')) return;
    api('/v1/admin/revoke', { method: 'POST', body: { user_id: u.id, sku: sku } })
      .then(function () { say(u.email + ' ← ' + sku + ' алынды'); return load(); })
      .catch(function (e) { say(e.message, true); });
  }

  function show(authed) {
    gate.hidden = authed;
    panel.hidden = !authed;
  }

  document.getElementById('enter').addEventListener('click', function () {
    var v = document.getElementById('tok').value.trim();
    if (!v) return;
    setToken(v);
    load().then(function () { show(true); msgEl.innerHTML = ''; })
      .catch(function (e) { setToken(''); say(e.message, true); });
  });
  document.getElementById('tok').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('enter').click();
  });
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('reload').addEventListener('click', function () {
    load().catch(function (e) { say(e.message, true); });
  });
  document.getElementById('out').addEventListener('click', function () {
    setToken(''); users = []; show(false);
  });

  // A token already in this tab means a reload should not ask again — but it
  // still has to be proved good, or a revoked token would show an empty panel
  // instead of the login form.
  if (token()) {
    load().then(function () { show(true); })
      .catch(function () { setToken(''); show(false); });
  } else {
    show(false);
  }
})();
</script>
</body>
</html>
